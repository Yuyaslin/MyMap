        /* Region Color Palette Mapping */
        const REGION_COLORS = {
            '北部': '#3b82f6', // Blue
            '中部': '#22c55e', // Green
            '南部': '#f97316', // Orange
            '東部': '#06b6d4', // Cyan
            '離島': '#a855f7'  // Purple
        };

        /* State Variables */
        let activeRegion = '全部';
        let activeCategory = '全部';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('tw_travel_favs')) || [];
        let leafletMap = null;
        let markersGroup = null;
        let markerMap = {};

        window.onload = function() {
            initMap();
            renderFilterButtons();
            renderAttractions();
            updateFavoriteBadge();
        };

        /* Initialize Leaflet Map */
        function initMap() {
            // Taiwan Center Coordinates
            leafletMap = L.map('map', {
                zoomControl: false
            }).setView([23.7, 120.95], 7.5);

            // Add Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(leafletMap);

            // OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafletMap);

            markersGroup = L.layerGroup().addTo(leafletMap);
        }

        /* Render Filter Buttons */
        function renderFilterButtons() {
            const regions = ['全部', '北部', '中部', '南部', '東部', '離島'];
            const categories = ['全部', '自然風光', '歷史人文', '網美打卡', '親子同樂', '主題樂園'];

            // Render Regions
            const regionContainer = document.getElementById('regionFilters');
            regionContainer.innerHTML = regions.map(r => `
                <button onclick="setRegion('${r}')" class="px-3 py-1 rounded-full text-xs font-semibold transition ${
                    activeRegion === r 
                    ? 'bg-slate-800 text-white shadow' 
                    : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                }">${r}</button>
            `).join('');

            // Render Categories
            const categoryContainer = document.getElementById('categoryFilters');
            categoryContainer.innerHTML = categories.map(c => `
                <button onclick="setCategory('${c}')" class="px-3 py-1 rounded-full text-xs font-semibold transition ${
                    activeCategory === c 
                    ? 'bg-brand-600 text-white shadow' 
                    : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                }">${c}</button>
            `).join('');
        }

        /* Filter & Search Logic */
        function getFilteredAttractions() {
            return ATTRACTIONS.filter(item => {
                const matchRegion = activeRegion === '全部' || item.region === activeRegion;
                const matchCategory = activeCategory === '全部' || item.category === activeCategory;
                const matchSearch = searchQuery === '' || 
                    item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.city.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.description.toLowerCase().includes(searchQuery.toLowerCase());
                
                return matchRegion && matchCategory && matchSearch;
            });
        }

        /* Render Attractions List & Map Markers */
        function renderAttractions() {
            const filtered = getFilteredAttractions();
            document.getElementById('resultCount').innerText = filtered.length;

            const listContainer = document.getElementById('attractionList');
            listContainer.innerHTML = '';
            markersGroup.clearLayers();
            markerMap = {};

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-compass text-4xl mb-3"></i>
                        <p class="font-medium">找不到符合條件的景點</p>
                        <p class="text-xs mt-1">請嘗試調整搜尋或篩選條件</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const isFav = favorites.includes(item.id);
                const regionColor = REGION_COLORS[item.region] || '#22c55e';

                // 1. Create List Card UI
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-3 border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 flex gap-3.5 cursor-pointer group";
                card.onclick = () => openDetailModal(item.id);
                card.innerHTML = `
                    <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden flex-shrink-0 bg-slate-100">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-1.5 left-1.5 text-[10px] font-bold text-white px-2 py-0.5 rounded-md backdrop-blur-md shadow-sm" style="background-color: ${regionColor}d0">
                            ${item.region}
                        </span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-800 text-base group-hover:text-brand-600 transition">${item.name}</h3>
                                <button onclick="event.stopPropagation(); toggleFavorite('${item.id}')" class="text-slate-300 hover:text-red-500 p-1 transition">
                                    <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-base"></i>
                                </button>
                            </div>
                            <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                                <i class="fa-solid fa-location-dot text-slate-400 text-[11px]"></i> ${item.city}
                            </p>
                        </div>
                        <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50 text-xs">
                            <span class="bg-slate-100 text-slate-600 font-medium px-2 py-0.5 rounded text-[11px]">${item.category}</span>
                            <span class="text-amber-500 font-bold flex items-center gap-1">
                                <i class="fa-solid fa-star text-[10px]"></i> ${item.rating}
                            </span>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);

                // 2. Create Leaflet Custom Marker Icon
                const customIcon = L.divIcon({
                    className: 'custom-map-pin',
                    html: `
                        <div class="w-8 h-8 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-xs transition-transform hover:scale-110" style="background-color: ${regionColor};">
                            <i class="fa-solid fa-location-dot text-sm"></i>
                        </div>
                    `,
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -32]
                });

                // 3. Add Marker to Leaflet Map
                const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(markersGroup);

                // Custom Popup Window content
                const popupContent = `
                    <div class="rounded-xl overflow-hidden">
                        <img src="${item.image}" class="w-full h-28 object-cover">
                        <div class="p-3">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded" style="background-color: ${regionColor}">${item.region}</span>
                                <span class="text-xs font-bold text-amber-500"><i class="fa-solid fa-star"></i> ${item.rating}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm mb-1">${item.name}</h4>
                            <p class="text-xs text-slate-500 mb-3">${item.city}</p>
                            <button onclick="openDetailModal('${item.id}')" class="w-full bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold py-1.5 rounded-lg transition">
                                查看景點詳情
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markerMap[item.id] = marker;
            });
        }

        /* Filter Handlers */
        function setRegion(region) {
            activeRegion = region;
            renderFilterButtons();
            renderAttractions();
        }

        function setCategory(category) {
            activeCategory = category;
            renderFilterButtons();
            renderAttractions();
        }

        function handleSearch(val) {
            searchQuery = val;
            const clearBtn = document.getElementById('clearSearchBtn');
            if (val.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderAttractions();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderAttractions();
        }

        function resetFilters() {
            activeRegion = '全部';
            activeCategory = '全部';
            clearSearch();
            renderFilterButtons();
            renderAttractions();
            leafletMap.setView([23.7, 120.95], 7.5);
        }

        /* Open Detail View Modal */
        function openDetailModal(id) {
            const item = ATTRACTIONS.find(a => a.id === id);
            if (!item) return;

            // Pan Leaflet map to target attraction
            if (leafletMap && markerMap[id]) {
                leafletMap.panTo([item.lat, item.lng]);
                markerMap[id].openPopup();
            }

            // Populate Modal Content
            document.getElementById('modalImage').src = item.image;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalLocation').querySelector('span').innerText = item.city;
            document.getElementById('modalRegionBadge').innerText = item.region;
            document.getElementById('modalRegionBadge').style.backgroundColor = REGION_COLORS[item.region] || '#22c55e';
            document.getElementById('modalCategoryBadge').innerText = item.category;
            document.getElementById('modalRating').innerText = item.rating + ' / 5.0';
            document.getElementById('modalTime').innerText = item.timeNeeded;
            document.getElementById('modalTicket').innerText = item.ticket;
            document.getElementById('modalDescription').innerText = item.description;

            // Render Highlights Badges
            const highlightsContainer = document.getElementById('modalHighlights');
            highlightsContainer.innerHTML = item.highlights.map(h => `
                <span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg border border-slate-200">
                    ✨ ${h}
                </span>
            `).join('');

            // Setup Navigation Link
            const navBtn = document.getElementById('modalNavBtn');
            navBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.city)}`;

            // Setup Favorite Button State
            const isFav = favorites.includes(item.id);
            const favBtn = document.getElementById('modalFavBtn');
            favBtn.setAttribute('onclick', `toggleFavorite('${item.id}'); updateModalFavBtn('${item.id}');`);
            updateModalFavBtnState(favBtn, isFav);

            // Show Modal with Animation
            const modal = document.getElementById('detailModal');
            const card = document.getElementById('detailModalCard');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function updateModalFavBtn(id) {
            const isFav = favorites.includes(id);
            const favBtn = document.getElementById('modalFavBtn');
            updateModalFavBtnState(favBtn, isFav);
        }

        function updateModalFavBtnState(btn, isFav) {
            if (isFav) {
                btn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-red-500/20";
                btn.innerHTML = `<i class="fa-solid fa-heart"></i> 已在行程清單中 (點擊移除)`;
            } else {
                btn.className = "flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-brand-600/20";
                btn.innerHTML = `<i class="fa-solid fa-heart"></i> 加入我的行程`;
            }
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const card = document.getElementById('detailModalCard');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }

        /* Favorites / Itinerary Management */
        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            const item = ATTRACTIONS.find(a => a.id === id);

            if (index > -1) {
                favorites.splice(index, 1);
                showToast(`已從行程中移除 ${item ? item.name : ''}`, 'info');
            } else {
                favorites.push(id);
                showToast(`已成功加入 ${item ? item.name : ''} 至行程！`, 'success');
            }

            localStorage.setItem('tw_travel_favs', JSON.stringify(favorites));
            updateFavoriteBadge();
            renderAttractions();
            renderItineraryDrawer();
        }

        function updateFavoriteBadge() {
            const badge = document.getElementById('favoriteBadge');
            badge.innerText = favorites.length;
        }

        function toggleItineraryDrawer() {
            const drawer = document.getElementById('itineraryDrawer');
            const isHidden = drawer.classList.contains('translate-x-full');
            if (isHidden) {
                renderItineraryDrawer();
                drawer.classList.remove('translate-x-full');
            } else {
                drawer.classList.add('translate-x-full');
            }
        }

        function renderItineraryDrawer() {
            const container = document.getElementById('itineraryList');
            const totalText = document.getElementById('itineraryTotal');
            container.innerHTML = '';

            const favItems = ATTRACTIONS.filter(a => favorites.includes(a.id));
            totalText.innerText = `${favItems.length} 個景點`;

            if (favItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-heart-crack text-4xl mb-3 text-slate-300"></i>
                        <p class="font-medium text-slate-600">尚未加入任何行程</p>
                        <p class="text-xs text-slate-400 mt-1">點擊景點卡片上的愛心圖示開始收藏吧！</p>
                    </div>
                `;
                return;
            }

            favItems.forEach((item, idx) => {
                const el = document.createElement('div');
                el.className = "bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center gap-3";
                el.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-700 text-xs font-bold flex items-center justify-center flex-shrink-0">
                        ${idx + 1}
                    </span>
                    <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-sm truncate">${item.name}</h4>
                        <p class="text-xs text-slate-500 truncate">${item.city}</p>
                    </div>
                    <button onclick="toggleFavorite('${item.id}')" class="text-slate-400 hover:text-red-500 p-2 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(el);
            });
        }

        function clearItinerary() {
            if (favorites.length === 0) return;
            favorites = [];
            localStorage.setItem('tw_travel_favs', JSON.stringify([]));
            updateFavoriteBadge();
            renderAttractions();
            renderItineraryDrawer();
            showToast('已清空所有行程收藏', 'info');
        }

        /* Get User Location */
        function getUserLocation() {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援定位功能', 'error');
                return;
            }

            showToast('正在獲取您的目前位置...', 'info');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    leafletMap.setView([lat, lng], 12);

                    L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: 'user-pin',
                            html: `<div class="w-6 h-6 rounded-full bg-blue-600 border-2 border-white shadow-lg marker-active"></div>`,
                            iconSize: [24, 24]
                        })
                    }).addTo(leafletMap)
                    .bindPopup('<b>您目前的位置</b>')
                    .openPopup();

                    showToast('成功定位目前位置！', 'success');
                },
                (error) => {
                    showToast('無法取得位置，請確認定位權限', 'error');
                }
            );
        }

        /* Mobile View Toggle (List vs. Map) */
        let isMobileMapView = true;
        function toggleMobileView() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('viewToggleText');
            const toggleBtn = document.getElementById('viewToggleBtn');

            if (isMobileMapView) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('fixed', 'inset-0', 'top-16', 'z-20');
                toggleText.innerText = '切換至地圖';
                toggleBtn.querySelector('i').className = 'fa-solid fa-map-location-dot';
                isMobileMapView = false;
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('fixed', 'inset-0', 'top-16', 'z-20');
                toggleText.innerText = '切換至清單';
                toggleBtn.querySelector('i').className = 'fa-solid fa-list-ul';
                isMobileMapView = true;
                setTimeout(() => leafletMap.invalidateSize(), 200);
            }
        }

        /* Toast Notification Helper */
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-brand-500';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-500';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-500';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            }, 3000);
        }
    </script>
</body>
</html>
